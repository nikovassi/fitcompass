  <meta name="theme-color" content="#0b8a5c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Навигационна пътека"><a href="index.html">Начало</a><span>/</span><a href="workouts.html">Тренировки</a><span>/</span><span>Упражнения</span></nav>
        <span class="eyebrow"><i data-icon="dumbbell"></i>Тренирай</span>

      </div>
